[project]
name = "gta6-intelligence"
version = "0.1.0"
description = "North Analytics — GTA VI Launch Intelligence: public-data collection, analysis and dashboard data products."
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "alembic>=1.14",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
]

[project.scripts]
gta6 = "gta6_intelligence.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gta6_intelligence"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DTZ"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff.lint.per-file-ignores]
# Test fixtures are clearer as one CSV line per string.
"tests/**" = ["E501"]
