# Alembic config for running migrations by hand, e.g.:
#   uv run alembic upgrade head
#   uv run alembic revision --autogenerate -m "add search_observations"
# The database URL comes from DATABASE_URL (see .env.example).
# Everyday use: `uv run gta6 db upgrade`.

[alembic]
script_location = src/gta6_intelligence/db/migrations
prepend_sys_path = src

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
